<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>《RO仙境傳說：口袋戰記》 寵物圖鑑</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
      color: #202b34;
      background: #edf1ef;
    }

    * { box-sizing: border-box; }
    body { margin: 0; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      min-height: 86px;
      padding: 15px clamp(18px, 4vw, 56px);
      color: #24352e;
      background: #fff;
      border-bottom: 1px solid #dce5df;
      box-shadow: 0 3px 14px #1c34270a;
    }

    .topbar h1 { margin: 0; font-size: clamp(19px, 2.2vw, 25px); letter-spacing: .01em; }
    .server-meta, .server-item { display: flex; align-items: center; }
    .server-meta { flex-wrap: wrap; justify-content: flex-end; gap: 8px; }

    .server-item {
      gap: 7px;
      padding: 8px 11px;
      border: 1px solid #e1e8e3;
      border-radius: 8px;
      background: #f7f9f7;
      white-space: nowrap;
    }

    .server-item span { color: #77857e; font-size: 11px; }
    .server-item strong { color: #2e463a; font-size: 13px; font-weight: 700; }

    .server-badge {
      padding: 8px 12px;
      border: 1px solid #e9d8a8;
      border-radius: 8px;
      color: #75571e;
      background: #fbf3dc;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .workspace {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      width: min(1560px, calc(100% - 36px));
      margin: 16px auto 48px;
      align-items: start;
    }

    .sidebar {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      align-items: start;
    }

    .panel, .results, .results-heading {
      border: 1px solid #dfe6e1;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 5px 18px #1c342708;
    }

    .panel { padding: 15px; }
    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .panel-title h2, .results-heading h2 { margin: 0; font-size: 17px; }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    label.control { display: grid; gap: 6px; font-size: 12px; font-weight: 700; }

    input[type="search"], select {
      width: 100%;
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid #d3ddd8;
      border-radius: 8px;
      color: inherit;
      background: #fbfcfb;
      font: inherit;
    }

    input[type="search"]:focus, select:focus {
      outline: 2px solid #8bd1bb;
      border-color: #409b7f;
    }

    .bond-count { color: #73817d; font-size: 11px; }
    .bond-actions { display: flex; align-items: center; gap: 9px; }

    button {
      min-height: 31px;
      padding: 5px 9px;
      border: 1px solid #d3ddd8;
      border-radius: 7px;
      color: #36534a;
      background: #fff;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    button:hover { border-color: #409b7f; color: #176552; background: #f2faf6; }

    .bond-groups {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .bond-group {
      padding-top: 11px;
      border-top: 1px solid #edf1ee;
    }

    .bond-group h3 {
      margin: 0 0 8px;
      color: #73817d;
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .06em;
    }

    .bond-options { display: flex; flex-wrap: wrap; gap: 6px; }

    .bond-option {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 7px;
      border: 1px solid #e0e7e2;
      border-radius: 7px;
      color: #46564f;
      background: #fff;
      font-size: 11px;
      cursor: pointer;
    }

    .bond-option:has(input:checked) {
      border-color: #64b99c;
      color: #155e49;
      background: #e9f7f0;
    }

    .bond-option input { margin: 0; accent-color: #25866a; }

    .content { min-width: 0; }

    .results-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
      padding: 17px 20px;
    }

    .results-heading .eyebrow { margin-bottom: 5px; }

    .summary {
      margin-top: 6px;
      color: #75827d;
      font-size: 12px;
    }

    .collection-count {
      padding: 8px 11px;
      border-radius: 8px;
      color: #176552;
      background: #e9f7f0;
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
    }

    .results { overflow: hidden; }
    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      min-width: 850px;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 10px 11px;
      border-bottom: 1px solid #edf1ee;
      vertical-align: top;
      font-size: 12px;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      color: #62726c;
      background: #f5f8f6;
      font-size: 11px;
      white-space: nowrap;
    }

    tbody tr:hover { background: #f7fbf8; }
    td.name { min-width: 130px; font-weight: 700; color: #214f40; }
    td.stars { color: #bd7b23; white-space: nowrap; letter-spacing: 1px; }
    td.skills { min-width: 160px; white-space: pre-line; }

    .tag {
      display: inline-block;
      margin: 0 4px 4px 0;
      padding: 3px 6px;
      border-radius: 5px;
      color: #256c58;
      background: #e9f6ef;
      white-space: nowrap;
    }

    .empty { padding: 32px; color: #75827d; text-align: center; }

    .offline-notice {
      display: flex;
      align-items: center;
      gap: 10px;
      width: min(1560px, calc(100% - 36px));
      margin: 14px auto 0;
      padding: 10px 13px;
      border: 1px solid #eadcad;
      border-radius: 9px;
      color: #66572c;
      background: #fff9e9;
      font-size: 12px;
      line-height: 1.5;
    }

    .offline-notice strong {
      flex: 0 0 auto;
      color: #795b1e;
    }

    .eyebrow {
      margin-bottom: 4px;
      color: #77857e;
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .1em;
    }

    @media (max-width: 760px) {
      .topbar { align-items: flex-start; flex-direction: column; gap: 12px; }
      .server-meta { justify-content: flex-start; }
      .workspace, .offline-notice { width: min(100% - 24px, 680px); }
      .workspace { margin-top: 12px; }
      .toolbar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .filter-panel .control:first-child { grid-column: 1 / -1; }
      .bond-groups { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    }

    @media (max-width: 520px) {
      .server-meta { gap: 6px; }
      .server-item { padding: 7px 9px; }
      .toolbar { grid-template-columns: 1fr; }
      .filter-panel .control:first-child { grid-column: auto; }
      .bond-groups { grid-template-columns: 1fr; }
      .results-heading { align-items: flex-start; padding: 14px; }
      .offline-notice { align-items: flex-start; flex-direction: column; gap: 3px; }
    }
  </style>
</head>

  <header class="topbar">
    <h1>《RO仙境傳說：口袋戰記》 寵物圖鑑</h1>
    <div class="server-meta" aria-label="伺服器與公會資訊">
      <div class="server-item"><span>伺服器</span><strong>普隆德拉 1</strong></div>
      <div class="server-item"><span>公會</span><strong>可口可樂</strong></div>
      <span class="server-badge">御用</span>
    </div>
  </header>
  <aside class="offline-notice" role="note">
    <strong>離線資料提醒</strong>
    <span>本圖鑑為離線整理版本，非官方資料且不會即時同步；內容可能與目前版本不同，請以官方公告及遊戲內資訊為準。</span>
  </aside>
  <main class="workspace">

          <label class="control">搜尋寵物
            <input id="search" type="search" placeholder="輸入寵物名稱">
          </label>
          <label class="control">分類
            <select id="family"><option value="">全部分類</option></select>
          </label>
          <label class="control">最低羈絆數
            <select id="minimum-bonds"></select>
          </label>
        </div>
      </section>
      <section class="panel bond-panel" aria-label="羈絆設定">
        <div class="panel-title">
          <h2>羈絆篩選</h2>
          <div class="bond-actions">
            <div id="bond-count" class="bond-count"></div>
            <button id="clear" type="button">清除</button>
          </div>
        </div>
        <div id="bond-groups" class="bond-groups"></div>
      </section>
    </aside>
    <section class="content" aria-label="寵物清單">
      <div class="results-heading">
        <div>
          <div class="eyebrow">圖鑑總覽</div>
          <h2>寵物清單</h2>
          <div id="summary" class="summary" aria-live="polite"></div>
        </div>
        <span class="collection-count">276 筆圖鑑</span>
      </div>
      <section class="results">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>優先</th>
                <th>星數</th>
                <th>寵物</th>
                <th>分類</th>
                <th>屬性</th>
                <th>體型</th>
                <th>戰鬥定位</th>
                <th>技能</th>
                <th>符合的羈絆</th>
              </tr>
            </thead>
            <tbody id="results"></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>

    const selectedBonds = new Set();
    const bondGroups = document.querySelector("#bond-groups");
    const familySelect = document.querySelector("#family");
    const minimumBondSelect = document.querySelector("#minimum-bonds");
    const resultsBody = document.querySelector("#results");
    const summary = document.querySelector("#summary");

    function groupForBond(bond) {
      if (bond === "近戰羈絆" || bond === "遠程羈絆") return "距離";
      if (bond.endsWith("屬性羈絆")) return "屬性";
      return "職業";
    }

    function createCell(row, value, className) {
      const cell = document.createElement("td");
      if (className) cell.className = className;
      cell.textContent = value;
      row.append(cell);
      return cell;
    }

    function updateMinimumOptions() {
      const previous = Number(minimumBondSelect.value);
      const max = pets.reduce(
        (highest, pet) => Math.max(
          highest,
          pet.bonds.filter(bond => selectedBonds.has(bond)).length
        ),
        0
      );
      minimumBondSelect.replaceChildren();
      for (let count = 0; count <= max; count += 1) {
        const option = document.createElement("option");
        option.value = String(count);
        option.textContent = count === 0 ? "不限制" : `至少 ${count} 項`;
        minimumBondSelect.append(option);
      }
      minimumBondSelect.value = String(Math.min(previous, max));
    }

    function renderBonds() {
      const groups = new Map([
        ["距離", []],
        ["屬性", []],
        ["職業", []]
      ]);
      const allBonds = [...new Set(pets.flatMap(pet => pet.bonds))];
      for (const bond of allBonds) groups.get(groupForBond(bond)).push(bond);
      bondGroups.replaceChildren();

      for (const [groupName, bonds] of groups) {
        const section = document.createElement("section");
        section.className = "bond-group";
        const heading = document.createElement("h3");
        heading.textContent = groupName;
        const options = document.createElement("div");
        options.className = "bond-options";
        for (const bond of bonds) {
          const label = document.createElement("label");
          label.className = "bond-option";
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.value = bond;
          checkbox.checked = selectedBonds.has(bond);
          checkbox.addEventListener("change", () => {
            if (checkbox.checked) selectedBonds.add(bond);
            else selectedBonds.delete(bond);
            updateMinimumOptions();
            renderResults();
          });
          label.append(checkbox, document.createTextNode(bond));
          options.append(label);
        }
        section.append(heading, options);
        bondGroups.append(section);
      }

      document.querySelector("#bond-count").textContent =
        `已選 ${selectedBonds.size} 項羈絆；每隻寵物的星數依符合項目計算。`;
      updateMinimumOptions();
    }

    function renderResults() {
      const query = document.querySelector("#search").value.trim().toLocaleLowerCase();
      const family = familySelect.value;
      const minimum = Number(minimumBondSelect.value);
      const selected = [...selectedBonds];
      const matches = pets
        .map((pet, index) => ({
          pet,
          index,
          matchedBonds: pet.bonds.filter(bond => selectedBonds.has(bond))
        }))
        .filter(item =>
          item.matchedBonds.length >= minimum &&
          (!family || item.pet.family === family) &&
          (!query || item.pet.name.toLocaleLowerCase().includes(query))
        )
        .sort((a, b) => b.matchedBonds.length - a.matchedBonds.length || a.index - b.index);

      resultsBody.replaceChildren();
      matches.forEach((item, index) => {
        const { pet, matchedBonds } = item;
        const row = document.createElement("tr");
        createCell(row, String(index + 1));
        createCell(row, matchedBonds.length ? "★".repeat(matchedBonds.length) : "—", "stars");
        createCell(row, pet.name, "name");
        createCell(row, pet.family);
        createCell(row, pet.element);
        createCell(row, pet.size);
        createCell(row, pet.battle_role);
        createCell(row, pet.skills, "skills");
        const bondCell = document.createElement("td");
        for (const bond of matchedBonds) {
          const tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = bond;
          bondCell.append(tag);
        }
        row.append(bondCell);
        resultsBody.append(row);
      });

      if (!matches.length) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");
        cell.className = "empty";
        cell.colSpan = 9;
        cell.textContent = "沒有符合條件的寵物，請調整羈絆或星數。";
        row.append(cell);
        resultsBody.append(row);
      }

      summary.textContent =
        `符合 ${matches.length} / ${pets.length} 隻` +
        (selected.length ? ` · 依 ${selected.length} 項已選羈絆計星` : " · 尚未選擇羈絆");
    }

    const families = [...new Set(pets.map(pet => pet.family))];
    for (const family of families) {
      const option = document.createElement("option");
      option.value = family;
      option.textContent = family;
      familySelect.append(option);
    }

    document.querySelector("#search").addEventListener("input", renderResults);
    familySelect.addEventListener("change", renderResults);
    minimumBondSelect.addEventListener("change", renderResults);
    document.querySelector("#clear").addEventListener("click", () => {
      selectedBonds.clear();
      renderBonds();
      renderResults();
    });

    renderBonds();
    renderResults();
  </script>
